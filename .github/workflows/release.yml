name: release

on:
  push:
    branches: [workbench]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # release.mjs looks for a local branch; track the remote one when it exists (first run creates an orphan).
      - name: Track existing release branch
        run: git branch release origin/release || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Check, test, build, commit release branch
        run: npm run release
      - name: Publish release branch
        run: git push origin release
