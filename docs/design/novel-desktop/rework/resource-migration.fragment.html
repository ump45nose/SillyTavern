 if(tab==='停止与分词'){fields=field('分词器',select('分词器',['自动','OpenAI'],'自动'))+check('替换停止串中的宏',true)+field('自定义停止字符串','<textarea aria-label="自定义停止字符串">["[End]", "[Stop]"]</textarea>','mr-full');}
 if(tab==='推理格式'){fields=templates+field('推理前缀',input('推理前缀','<think>'))+field('推理后缀',input('推理后缀','</think>'))+field('推理分隔符',input('推理分隔符',''))+field('推理块数量上限',input('推理块数量上限','1','number'));checks=check('自动解析推理内容',true)+check('自动展开推理内容',false)+check('显示隐藏推理耗时',false)+check('加入后续提示词',false);}
 return `${tabs(['上下文','指令模板','系统提示词','停止与分词','推理格式'],tab,'format-tab')}<div class="mr-content">${pageHead('回复格式')}<section class="mr-section"><div class="mr-section-head"><h3 id="mr-template-title">${tab}</h3><span class="mr-spacer"></span><div class="mr-actions">${ib('更新模板','save','demo')}${ib('另存模板','plus','demo')}${ib('导入模板','upload','demo')}${ib('导出模板','download','demo')}${ib('删除模板','trash-2','demo')}</div></div><div class="mr-fields">${fields}</div></section>${checks?'<section class="mr-section"><div class="mr-section-head"><h3>行为</h3></div><div class="mr-settings-grid">'+checks+'</div></section>':''}<div class="mr-quiet-status" role="status"></div></div>`;
}
function settingsPage(){
 const tab=state.settingsTab;if(tab==='外观与阅读')return themePage();let fields='',checks='';
 if(tab==='消息与输入'){fields=field('发送按键',select('发送按键',['Enter','Ctrl + Enter'],'Enter'))+field('加载消息数量',input('加载消息数量','100','number'))+field('流式显示帧率',input('流式显示帧率','30','number'))+field('图片切换行为',select('图片切换行为',['切换图片','切换回复'],'切换图片'));checks=['自动滚动聊天','自动保存消息编辑','删除消息前确认','自动修复 Markdown','空输入发送时续写','禁止外部媒体','显示 HTML 标签','自动重生成'].map((x,i)=>check(x,i<4)).join('');}
 if(tab==='角色与群聊'){fields=field('角色简介来源',select('角色简介来源',['描述','作者注释'],'描述'))+field('导入角色标签',select('导入角色标签',['询问','全部导入','不导入'],'询问'));checks=check('模糊搜索',true)+check('优先角色卡主提示词',false)+check('优先角色卡历史后提示词',false);}
 if(tab==='声音与通知'){fields=field('通知位置',select('通知位置',['右上','左下'],'右上'));checks=check('消息提示音',false)+check('仅后台播放提示音',true);}
 if(tab==='脚本补全'){fields=field('补全可见性',select('补全可见性',['启用','禁用'],'启用'))+field('匹配方式',select('匹配方式',['模糊','前缀'],'模糊'))+field('补全样式',select('补全样式',['完整','紧凑'],'完整'))+field('键盘选择',select('键盘选择',['Tab','Enter'],'Tab'));checks=check('宏补全',true)+check('脚本参数补全',true);}
 if(tab==='账户'){fields=field('界面语言',select('界面语言',['简体中文','English'],'简体中文'));checks=b('账户管理','user-round','demo','mr-outline')+b('管理员面板','shield','demo','mr-outline')+b('退出登录','log-out','demo','mr-outline');}
 return `${tabs(['外观与阅读','消息与输入','角色与群聊','声音与通知','脚本补全','账户'],tab,'settings-tab')}<div class="mr-content">${pageHead('用户设置')}<section class="mr-section"><div class="mr-section-head"><h3>${tab}</h3></div><div class="mr-fields">${fields}</div></section><section class="mr-section"><div class="mr-settings-grid">${checks}</div></section><div class="mr-quiet-status" role="status"></div></div>`;
}
let dialogCallback=null;
function dialog(title,body,callback){root.querySelector('#mr-dialog-title').textContent=title;root.querySelector('#mr-dialog-body').innerHTML=body;dialogCallback=callback;root.querySelector('#mr-dialog').showModal();refreshIcons();}
root.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button||button.disabled)return;const a=button.dataset.action,v=button.dataset.value,i=Number(button.dataset.index),id=Number(button.dataset.id);
if(a==='page'){state.page=v;state.settingsTab=state.page==='formatting'?'上下文':'外观与阅读';render();}
else if(a==='resource'){state.page='home';state.resource=v;state.rail=true;state.resourceIndex=0;state.entryOpen=false;render();}
else if(a==='rail'){state.rail=!state.rail;render();}
else if(a==='left'){state.left=!state.left;render();}
else if(a==='resource-item'){state.resourceIndex=i;state.entry=0;state.entryOpen=false;render();}
else if(a==='user-fold'){state.userOpen=!state.userOpen;const box=button.closest('.mr-user');box.classList.toggle('is-open',state.userOpen);button.setAttribute('aria-expanded',String(state.userOpen));button.querySelector('span').innerHTML=state.userOpen?'你的输入':'你的输入　<span style="color:var(--mr-muted)">我推开窗，朝港口望去。</span>';}
else if(a==='entry-edit'){state.entry=i;state.entryOpen=true;render();}
else if(a==='entry-close'){state.entryOpen=false;render();}
else if(a==='pins'){const pins=root.querySelector('#mr-pins');pins.hidden=!pins.hidden;button.setAttribute('aria-expanded',String(!pins.hidden));}
else if(a==='character-open'){const r=roles.find(x=>x.id===id);roles.forEach(x=>x.current=x===r);state.hover=r.name;render();}
else if(a==='role-inspect'){inspectRole(roles.find(x=>x.id===id)?.name);}
else if(a==='bulk-copy'){const copies=roles.filter(x=>selected.has(x.id)).map((x,i)=>({...x,id:Date.now()+i,name:x.name+' · 副本',current:false}));roles.push(...copies);selected=new Set(copies.map(x=>x.id));renderRoles();status('已复制 '+copies.length+' 个示例角色');}
else if(a==='bulk-delete'){dialog('删除所选角色？','<p>将删除 '+selected.size+' 个预览示例。</p>',()=>{roles=roles.filter(x=>!selected.has(x.id));selected.clear();renderRoles();status('已删除所选预览示例');});}
else if(a==='bulk-export'){status('已选 '+selected.size+' 个角色；导出操作保留在顶部。');}
else if(a==='role-create'){roles.push({id:Date.now(),name:'新角色',tag:'未分类角色',avatar:assets.fixture,current:false});renderRoles();}
else if(a==='favorite'){button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')!=='true'?'true':'false');}
else if(a==='settings-tab'){state.settingsTab=v;render();}
else if(a==='format-tab'){state.settingsTab=v;render();const title=root.querySelector('#mr-template-title');title.textContent=v==='上下文'?'上下文模板':v;}
else if(a==='extensions-tab'){state.extensionTab=v;render();}
else if(a==='qr-add'){qrs.push({id:Date.now(),label:'新回复',text:'',open:true});renderQrs();}
else if(a==='qr-edit'){const x=qrs.find(x=>x.id===id);x.open=!x.open;renderQrs();}
else if(a==='qr-copy'){const x=qrs.find(x=>x.id===id);qrs.push({...x,id:Date.now(),label:x.label+' · 副本'});renderQrs();}
else if(a==='qr-more'){dialog('回复条目操作',b('移动到其他组','folder-input','dialog-close')+b('导出条目','download','dialog-close')+b('删除条目','trash-2','dialog-confirm'),()=>{qrs=qrs.filter(x=>x.id!==id);renderQrs();});}
else if(a==='qr-new-group'){dialog('新建回复组',field('组名称','<input id="mr-new-group" value="新回复组" aria-label="新回复组名称">'),()=>{const name=root.querySelector('#mr-new-group').value;const sel=root.querySelector('#mr-qr-group');sel.add(new Option(name,name));sel.value=name;state.qrGroup=name;});}
else if(a==='qr-activate'){status('在“'+v+'”中添加启用组；不改变其他作用域。');}
else if(a==='bg-scope'){state.bgScope=v;render();}
else if(a==='bg-folder'){state.bgFolder=v;render();}
else if(a==='bg-select'){state.bgSelected=i;renderBackgrounds();status('已选择背景：'+backgroundItems[i].name);}
else if(a==='bg-more'){const box=root.querySelector('#mr-bg-context-'+i);box.hidden=!box.hidden;}
else if(a==='bg-smaller'||a==='bg-larger'){root.querySelector('#mr-gallery').style.gridTemplateColumns=`repeat(auto-fill,minmax(${a==='bg-smaller'?150:250}px,1fr))`;}
else if(a==='persona-more'){dialog('身份备份与恢复',b('备份全部身份','download','dialog-close')+b('恢复备份','upload','dialog-close'),()=>{});}
else if(a==='reading-options'){dialog('阅读设置',`<div class="mr-fields">${field('字体',select('字体',['宋体 · 纸书','黑体 · 清晰'],'宋体 · 纸书','id="mr-font"'))}${field('字号 · 17px','<input id="mr-font-size" type="range" min="14" max="24" value="17" aria-label="字号">')}</div>`,()=>{});}
else if(a==='dialog-close'){root.querySelector('#mr-dialog').close();}
else if(a==='dialog-confirm'){dialogCallback?.();root.querySelector('#mr-dialog').close();}
else if(a==='character-tab'){state.characterTab=v;render();}
else if(a==='demo'||a==='more'||a==='bulk-tags'||a==='helper-tab'||a==='helper-script'){status('操作保留在所属组件内。');}
saveState();});
root.addEventListener('dblclick',e=>{const entry=e.target.closest('[data-entry]');if(entry&&state.page==='home'){state.entry=Number(entry.dataset.entry);state.entryOpen=true;render();}});
root.addEventListener('pointerover',e=>{const item=e.target.closest('[data-hover]');if(item)inspectRole(item.dataset.hover);});
root.addEventListener('focusin',e=>{const item=e.target.closest('[data-hover]');if(item)inspectRole(item.dataset.hover);});
root.addEventListener('change',e=>{const n=e.target;if(n.dataset.roleCheck){const id=Number(n.dataset.roleCheck);n.checked?selected.add(id):selected.delete(id);updateSelected();}if(n.id==='mr-role-all'){root.querySelectorAll('[data-role]').forEach(r=>n.checked?selected.add(Number(r.dataset.role)):selected.delete(Number(r.dataset.role)));updateSelected();}if(n.id==='mr-role-filter'){roleFilter=n.value;renderRoles();}if(n.id==='mr-role-sort'){roleSort=n.value;renderRoles();}if(n.id==='mr-world-scope'){state.worldScope=n.value;}if(n.id==='mr-qr-group'){state.qrGroup=n.value;qrs.forEach(x=>x.open=false);renderQrs();}if(n.id==='mr-font'){root.querySelectorAll('.mr-prose').forEach(e=>e.style.fontFamily=n.value.startsWith('黑体')?'system-ui':'Georgia,serif');}saveState();});
root.addEventListener('input',e=>{const n=e.target;if(n.id==='mr-resource-search'){root.querySelectorAll('.mr-resource').forEach(r=>r.hidden=!r.dataset.name.includes(n.value.toLowerCase()));}if(n.id==='mr-role-search'){roleQuery=n.value;renderRoles();}if(n.id==='mr-bg-search'){renderBackgrounds();}if(n.id==='mr-entry-search'){root.querySelectorAll('[data-entry]').forEach(r=>r.hidden=!r.textContent.includes(n.value));}if(n.id==='mr-font-size'){root.querySelectorAll('.mr-prose').forEach(e=>e.style.fontSize=n.value+'px');}});
root.addEventListener('change',e=>{const node=e.target;if(node.id==='mr-world-scope')refreshIcons();if(node.dataset.worldEnable!==undefined){const id=Number(node.dataset.worldEnable);const list=state.worldEnabled[state.worldScope];state.worldEnabled[state.worldScope]=node.checked?[...new Set([...list,id])]:list.filter(x=>x!==id);saveState();}});
const arrangeRolePreview=()=>{const grid=root.querySelector('#mr-role-grid'),info=root.querySelector('#mr-role-inspector');if(grid&&info&&!grid.closest('.mr-role-body')){const layout=document.createElement('div');layout.className='mr-role-body';grid.before(layout);info.className='mr-hover-preview mr-role-preview';layout.append(info,grid);}};
const arrangeHomePanels=()=>{const left=root.querySelector('.mr-left');if(left&&!left.querySelector('.mr-left-info')){const info=document.createElement('div');info.className='mr-left-info';[...left.children].filter(x=>!x.classList.contains('mr-left-links')).forEach(x=>info.append(x));left.prepend(info);}const reading=root.querySelector('.mr-reading');if(reading&&!reading.querySelector('.mr-reading-flow')){const flow=document.createElement('div');flow.className='mr-reading-flow';[...reading.children].filter(x=>!x.classList.contains('mr-reading-bar')&&!x.classList.contains('mr-composer')).forEach(x=>flow.append(x));reading.querySelector('.mr-composer').before(flow);}};
const arrangePanels=()=>{arrangeRolePreview();arrangeHomePanels();};
const roleLayoutObserver=new MutationObserver(arrangePanels);roleLayoutObserver.observe(root.querySelector('#mr-view'),{childList:true,subtree:true});
render();
arrangePanels();
window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next&&names[next.page]&&!localSnapshots.has(JSON.stringify(next))&&(next.revision||0)>=(state.revision||0)&&JSON.stringify(next)!==JSON.stringify(state)){state={...state,...next};render();}});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'page',{label:'页面',options:Object.entries(names).map(([value,label])=>({value,label}))});}
})();
</script>
