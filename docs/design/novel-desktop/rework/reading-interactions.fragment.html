  if(kind==='files')return header('聊天文件')+[q('.rs-current-name').textContent,...history.map(c=>c[0])].map((n,i)=>`<div class="rs-file-row">${icon('file-text')}<span><strong>${esc(n)}</strong><small>${i===0?'当前对话 · ':''}JSONL</small></span><button class="rs-icon" data-action="export-file" aria-label="导出 ${esc(n)}">${icon('download')}</button></div>`).join('')+`<div class="rs-file-actions"><button data-action="import-file">${icon('upload')}导入</button><button data-action="rename">${icon('pencil')}重命名当前</button><button data-action="delete-chat">${icon('trash-2')}删除当前</button></div>`;
  if(kind==='group')return header('群聊')+`<div class="rs-pop-form"><label class="rs-field">群聊名称<input aria-label="群聊名称" value="雾港同行"></label><label class="rs-check"><input type="checkbox" checked>林间</label><label class="rs-check"><input type="checkbox" checked>沈砚</label><label class="rs-check"><input type="checkbox">灯塔守望者</label><button class="rs-primary" data-action="group-create">${icon('users-round')}新建群聊</button><button data-action="group-convert">将当前对话转为群聊</button></div>`;
  if(kind==='message')return header(`第 ${target} 层`)+row('pencil-line','编辑原文','edit')+row('copy','复制','copy')+row('git-branch','从这里分支','branch')+row('flag','保存检查点','checkpoint')+'<div class="rs-menu-divider"></div>'+row('languages','翻译','translate')+row('volume-2','朗读','tts')+row('paperclip','附件','attachment')+row('puzzle','更多插件操作','message-tools');
  if(kind==='attachment')return header('附件')+row('image','上传图片','upload-image')+row('file-up','上传文件','upload-file')+row('database','从资料库选择','data');
  if(kind==='delete-confirm')return header('删除当前聊天')+`<div class="rs-confirm"><p>删除「${esc(q('.rs-current-name').textContent)}」及其聊天文件？</p><div class="rs-confirm-actions"><button data-close>取消</button><button class="rs-primary" data-action="delete-chat-confirmed">删除</button></div></div>`;
  if(kind==='delete-message-confirm')return header('删除消息')+`<div class="rs-confirm"><p>删除所选消息？这会修改聊天记录。</p><div class="rs-confirm-actions"><button data-close>取消</button><button class="rs-primary" data-action="delete-messages-confirmed">确认删除</button></div></div>`;
  return header('工具设置')+'<div class="rs-menu-section">此入口接入对应扩展的完整设置页面。</div>';
 }
 function position(){if(!anchor||!open)return;const rr=root.getBoundingClientRect(),ar=anchor.getBoundingClientRect(),p=q('.rs-popover'),pr=p.getBoundingClientRect();let left=ar.left-rr.left;if(open==='reading')left=ar.right-rr.left-pr.width;left=Math.max(9,Math.min(left,rr.width-pr.width-10));let top=ar.top-rr.top-pr.height-8;if(top<10)top=ar.bottom-rr.top+8;top=Math.max(9,Math.min(top,rr.height-pr.height-9));p.style.left=left+'px';p.style.top=top+'px';}
 function show(kind,button){close();open=kind;anchor=button||q('[data-open="chat"]');anchor?.setAttribute('aria-expanded','true');q('.rs-overlay').hidden=false;q('.rs-popover').setAttribute('aria-label',({menu:'聊天菜单',tools:'扩展工具',quick:'快速回复',reading:'阅读设置',chat:'聊天管理',files:'聊天文件',group:'群聊'})[kind]||'操作');q('.rs-popover').innerHTML=popContent(kind);icons();position();q('.rs-popover button, .rs-popover input')?.focus();}
 function updatePop(){if(open){q('.rs-popover').innerHTML=popContent(open);icons();position();}}
 function editing(id){if(edit)finishEdit(false);edit=id;savedText=raw[id];if(id==='27'){state.userExpanded=true;apply();}const box=q(id==='27'?'.rs-user-body .rs-prose':`[data-message="${id}"] .rs-prose`);box.hidden=true;const wrapper=document.createElement('div');wrapper.className='rs-editor';wrapper.innerHTML=`<div class="rs-edit-bar"><small>原文</small><span class="rs-spacer"></span>${[['check','保存编辑','save','rs-save'],['copy','复制原文','copy',''],['lightbulb','提示词','inspect',''],['trash-2','删除消息','delete','rs-delete'],['chevron-up','上移消息','up',''],['chevron-down','下移消息','down',''],['x','取消编辑','cancel','']].map(([i,l,a,c])=>`<button class="${c}" data-edit-action="${a}" aria-label="${l}" data-tooltip="${l}">${icon(i)}</button>`).join('')}</div><textarea class="rs-edit-raw" aria-label="消息原文"></textarea>`;box.after(wrapper);wrapper.querySelector('textarea').value=raw[id];icons();wrapper.querySelector('textarea').focus();close();say('编辑原文 · 保留 Markdown、XML 与酒馆宏');}
 function finishEdit(save){if(!edit)return;const box=q(edit==='27'?'.rs-user-body .rs-prose':`[data-message="${edit}"] .rs-prose`);raw[edit]=save?q('.rs-edit-raw').value:savedText;box.innerHTML=prose(raw[edit]);box.hidden=false;q('.rs-editor')?.remove();edit=null;say(save?'已保存编辑 · 预览':'已取消编辑');}
 function chatAction(action){if(action==='new'){q('.rs-current-name').textContent='未命名新对话';q('.rs-title').textContent='未命名新对话';say('预览 · 已创建新对话');}else if(action==='close-chat'){q('.rs-current-top span:last-child').textContent='已关闭';say('预览 · 已关闭当前对话，记录仍保留');}close();}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-close'))return close(true);
  if(b.hasAttribute('data-selection-cancel'))return selectionEnd();
  if(b.hasAttribute('data-selection-confirm'))return show('delete-message-confirm',b);
  if(b.dataset.open){target=b.dataset.messageTarget||target;return open===b.dataset.open?close(true):show(b.dataset.open,b);}
  if(b.hasAttribute('data-history')){state.history=!state.history;apply();remember();return;}
  if(b.hasAttribute('data-outline-toggle')||b.hasAttribute('data-floors-toggle')){const name=b.hasAttribute('data-outline-toggle')?'outline':'floors';state[name]=!state[name];sidebar();remember();return;}
  if(b.dataset.floor){if(b.dataset.floor==='27'){state.userExpanded=true;apply();}const el=b.dataset.floor==='27'?q('.rs-user'):q(`[data-message="${b.dataset.floor}"]`);el?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'center'});say('第 '+b.dataset.floor+' 层'+(el?'':' · 此预览仅展示最近正文'));return;}
  if(b.dataset.settings){say('独立设置页 · '+b.textContent.trim()+'，见第二份预览');return;}
  if(b.hasAttribute('data-left-toggle')){state.left=!state.left;apply();remember();return;}
  if(b.hasAttribute('data-right-toggle')){q('.rs-right-hint').hidden=!q('.rs-right-hint').hidden;return;}
  if(b.classList.contains('rs-user-toggle')){if(edit==='27')return;state.userExpanded=!state.userExpanded;apply();remember();return;}
  if(b.dataset.font){state.font=b.dataset.font;apply();updatePop();remember();return;}
  if(b.dataset.meta){state.meta=b.dataset.meta;apply();updatePop();remember();return;}
  if(b.dataset.quickSet){quickSet=b.dataset.quickSet;updatePop();return;}
  if(b.dataset.quick!==undefined||b.dataset.quickEdit!==undefined){const x=quick[Number(b.dataset.quick??b.dataset.quickEdit)];if(x.kind==='运行脚本'&&b.dataset.quickEdit===undefined){say('预览 · 执行 '+x.text+'，不发送请求');close();}else{state.draft=x.text;q('.rs-draft').value=x.text;close();q('.rs-draft').focus();say('已插入输入框 · '+x.name);remember();}return;}
  if(b.dataset.edit)return editing(b.dataset.edit);
  if(b.dataset.chatLoad!==undefined){const c=history[Number(b.dataset.chatLoad)];q('.rs-current-name').textContent=c[0];q('.rs-title').textContent=c[0];say('预览 · 切换到 '+c[0]);return;}
  if(b.dataset.chatAction)return chatAction(b.dataset.chatAction);
  if(b.dataset.generate){if(b.dataset.generate==='impersonate'){state.draft='我接过信，指尖停在那枚褪色的邮戳上。';q('.rs-draft').value=state.draft;remember();say('AI 帮答示意 · 写入草稿，尚未发送');}else say(b.dataset.generate==='continue'?'续写示意 · 保持正文布局，不显示角色信息':'重生成示意 · 原生生成链路将在确认后接入');return;}
  if(b.hasAttribute('data-send')){say(state.draft?'预览 · 发送内容仍保留在草稿中':'预览 · 空输入沿用原生续写行为');return;}
  if(b.dataset.editAction){const a=b.dataset.editAction;if(a==='save'||a==='cancel')finishEdit(a==='save');else if(a==='delete')show('delete-message-confirm',b);else say(a==='copy'?'原文复制示意':a==='inspect'?'提示词检查示意':'调整消息顺序示意 · 原文保留');return;}
  const a=b.dataset.action;if(!a)return;
  if(['group','files','rename','attachment','delete-confirm','note','cfg','probabilities','checkpoint','image'].includes(a))return show(a,anchor);
  if(a==='new'||a==='close-chat')return chatAction(a);
  if(a==='edit')return editing(target);
  if(a==='rename-save'){const n=q('[data-chat-name]').value.trim();if(n){q('.rs-current-name').textContent=n;q('.rs-title').textContent=n;}close();say('已保存名称 · 预览');return;}
  if(a==='delete-chat')return show('delete-confirm',anchor);
  if(a==='select-delete'){qa('.rs-message,.rs-user').forEach(x=>x.classList.add('is-selecting'));state.userExpanded=true;apply();q('.rs-delete-strip').hidden=false;close();say('选择需删除的楼层后确认');return;}
  if(a==='delete-messages-confirmed'){selectionEnd();say('预览 · 删除已选择的消息，未修改真实聊天');close();return;}
  if(a==='delete-chat-confirmed'){say('预览 · 删除当前聊天，未修改真实文件');close();return;}
  if(['note-save','cfg-save','checkpoint-save','image-generate'].includes(a)){say('预览 · '+b.textContent.trim()+'，未修改真实数据或发送请求');close();return;}
  const names={'qr-settings':'快速回复完整管理','extensions-settings':'扩展设置','note':'作者注释','cfg':'CFG 引导','probabilities':'Token 概率','checkpoint':'保存检查点','parent':'返回父对话','image':'生图工具','data':'资料库','translate':'翻译','tts':'朗读','gallery':'图片画廊','notebook':'笔记本','dice':'掷骰子','other-tools':'其他已安装工具','group-create':'新建群聊','group-convert':'转换群聊','export-file':'导出 JSONL','import-file':'导入聊天文件','copy':'复制原文','branch':'创建分支','message-tools':'消息扩展工具','upload-image':'上传图片','upload-file':'上传文件'};say('预览 · '+(names[a]||a));close();
 });
 root.addEventListener('input',e=>{const x=e.target;if(x.classList.contains('rs-draft')){state.draft=x.value;remember();}if(x.hasAttribute('data-size')){state.size=Number(x.value);root.style.setProperty('--nr-font',state.size+'px');q('[data-size-output]').textContent=state.size+' px';position();remember();}if(x.hasAttribute('data-leading')){state.leading=Number(x.value);root.style.setProperty('--nr-leading',state.leading);q('[data-leading-output]').textContent=state.leading;position();remember();}if(x.matches('[aria-label="搜索快速回复"]')){query=x.value;const start=x.selectionStart;updatePop();const fresh=q('[aria-label="搜索快速回复"]');fresh.focus();fresh.setSelectionRange(start,start);}});
 root.addEventListener('change',e=>{if(e.target.hasAttribute('data-collapse')){state.collapsed=e.target.checked;state.userExpanded=!state.collapsed||edit==='27';apply();remember();}if(e.target.hasAttribute('data-select-all'))qa('.rs-selection-check input').forEach(x=>x.checked=e.target.checked);if(e.target.closest('.rs-selection-check')||e.target.hasAttribute('data-select-all')){const n=qa('.rs-selection-check input:checked').length;q('[data-delete-count]').textContent=n+' 条已选';q('[data-selection-confirm]').disabled=n===0;}});
 document.addEventListener('pointerdown',e=>{if(open&&!q('.rs-popover').contains(e.target)&&!anchor?.contains(e.target))close();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open){e.preventDefault();close(true);}else if(e.key==='Escape'&&edit){finishEdit(false);}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&edit){e.preventDefault();finishEdit(true);}});
 let gripStart;const grip=q('.rs-grip');grip.addEventListener('pointerdown',e=>{gripStart={y:e.clientY,h:q('.rs-draft').offsetHeight};grip.setPointerCapture(e.pointerId);});grip.addEventListener('pointermove',e=>{if(gripStart)q('.rs-draft').style.height=Math.max(61,Math.min(230,gripStart.h+gripStart.y-e.clientY))+'px';});grip.addEventListener('pointerup',()=>gripStart=null);grip.addEventListener('pointercancel',()=>gripStart=null);
 window.addEventListener('resize',position);window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&typeof s==='object'){if(s===state||JSON.stringify(s)===JSON.stringify(state))return;state={...state,...s};apply();}});
 function sidebar(){for(const name of ['outline','floors']){q(`[data-${name}-toggle]`).setAttribute('aria-expanded',String(state[name]));const body=q('#rs-'+name+'-content');body.classList.toggle('is-open',state[name]);body.inert=!state[name];}}
 window.addEventListener('openai:set_globals',sidebar);sidebar();apply();if(globalThis.Tweak){const design={menuWidth:294};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--rs-menu-width',design.menuWidth+'px');q('.rs-popover').style.width=`min(${design.menuWidth}px,calc(100% - 20px))`;position();}});tweak.addSlider(design,'menuWidth',{label:'弹出框宽度',min:260,max:340,unit:'px'});}
