 return page(state.extension+' · 设置','扩展设置保留自己的完整表单')+section('扩展',grid(field('extension-select','选择扩展','select',state.extension,extensions.map(x=>x[0]))))+section('通用',checks(check('extension-enabled','启用扩展',true),check('extension-tools','在扩展工具中显示',true)))+section('脚本与呈现',checks(check('helper-iframe','启用角色卡 iframe',true),check('helper-script','启用脚本执行',true),check('helper-global','启用全局脚本',true)))+section('设置与资源',actions([['code-xml','脚本管理','helper-scripts'],['file-code','变量管理','helper-vars'],['book-open','扩展说明','extension-docs']]))+`<details><summary>日志与扩展原有其他设置</summary>${grid(field('helper-log','日志级别','select','信息',['信息','调试','警告','错误']))}</details>`;}
 function characters(){return page(state.sub==='群组'?'群组管理':'角色管理','搜索、收藏、标签与批量操作',actions([['plus','新建','char-new'],['upload','导入','char-import']]))+`<label class="ss-search">${icon('search')}<input aria-label="搜索角色" placeholder="搜索名称、简介或标签" data-role-search></label><div class="ss-row" style="margin-bottom:17px">${field('char-filter','筛选','select','全部角色',['全部角色','收藏','当前角色'])}<span class="ss-spacer"></span><span class="ss-tag" data-selection-count>${state.selectedRoles.length} 已选</span>${actions([['download','导出','char-export'],['tags','标签','char-tags'],['trash-2','删除','char-delete']])}</div><div class="ss-roles">${[['林间','雾港书店的守信人'],['沈砚','带着旧信回到故乡'],['灯塔守望者','等待最后一艘船'],['夏禾','花店与午后的来信']].map(([n,c],i)=>`<article class="ss-role ${state.selectedRoles.includes(i)?'is-selected':''}" data-role-name="${n}"><label><input type="checkbox" aria-label="选择 ${n}" data-role-select="${i}" ${state.selectedRoles.includes(i)?'checked':''}></label><div class="ss-avatar">${n[0]}</div><strong>${n}</strong><small>${c}</small><button data-action="char-edit">编辑角色</button></article>`).join('')}</div>`;}
 function worldFour(){const holder=document.createElement('div');holder.innerHTML=world();const worldGrid=holder.querySelector('.ss-world-grid'),editor=worldGrid.children[2],parameters=document.createElement('section');worldGrid.children[0].innerHTML=resourceList([]);parameters.append(editor.querySelectorAll('.ss-section')[1],editor.querySelector('details'));worldGrid.append(parameters);holder.querySelector('.ss-page-head small').textContent=activeResource()?.name||'全部世界书';return holder.innerHTML;}
 function content(){fields.clear();switch(state.module){case'user':return user();case'format':return formatting();case'generation':return generation();case'connection':return connection();case'world':return worldFour();case'persona':return persona();case'background':return backgrounds();case'extensions':return extensionPage();case'characters':return characters();}}
 function render(){
  close();const def=modules.find(m=>m[0]===state.module),same=renderedModule===state.module;
  if(!def[3].includes(state.sub))state.sub=def[3][0];
  if(!q('.ss-nav button'))q('.ss-nav').innerHTML=modules.map(([id,i,n])=>`<button data-module="${id}" aria-pressed="false">${icon(i)}${n}</button>`).join('')+'<div class="ss-nav-foot">Noval 工作台<br>独立设置工作区</div>';
  qa('[data-module]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.module===state.module)));
  if(!same){q('.ss-header-title').innerHTML=icon(def[1])+`<span>${def[2]}</span>`;q('.ss-subnav').innerHTML=def[3].map(s=>`<button data-sub="${s}" aria-pressed="${s===state.sub}">${s}</button>`).join('');}
  else qa('[data-sub]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sub===state.sub)));
  const rail=same?q('.ss-manager-list'):null,oldIds=rail?[...rail.querySelectorAll('[data-resource-id]')].map(r=>r.dataset.resourceId):[];
  const promptList=same?q('.ss-prompt-list'):null,entryList=same&&state.module==='world'?q('.ss-world-grid>section:nth-child(2)'):null;
  if(manager())state.resource=Math.min(Math.max(0,state.resource),Math.max(0,catalog().length-1));
  const html=manager()&&catalog().length===0?page(resourceLabel()+'管理','全部资源')+`<div class="ss-empty-resources"><span>还没有${resourceLabel()}</span><button class="ss-outline" data-new-resource>${icon('plus')}新建${resourceLabel()}</button></div>`:content();
  q('.ss-content').innerHTML=html;
  if(promptList&&q('.ss-prompt-list')){q('.ss-prompt-list').replaceWith(promptList);[...promptList.children].forEach((el,i)=>{el.classList.toggle('is-current',i===state.prompt);el.querySelector('input').checked=value('prompt-'+i+'-enabled',true);});}
  if(entryList&&q('.ss-world-grid>section:nth-child(2)')){q('.ss-world-grid>section:nth-child(2)').replaceWith(entryList);[...entryList.querySelectorAll('.ss-world-entry')].forEach((el,i)=>{el.classList.toggle('is-current',i===state.prompt);el.querySelector('input').checked=value('entry-'+i,true);});}
  if(manager()){
   const newRail=q('.ss-manager-list');
   if(rail&&newRail&&JSON.stringify(oldIds)===JSON.stringify(catalog().map(r=>r.id)))newRail.replaceWith(rail);
   q('.ss-page-head').insertAdjacentHTML('afterend',batchbar());
   if(state.module==='connection'&&activeResource()){q('.ss-page-head small').textContent='当前编辑 · '+activeResource().name;q('[data-field=profile-name]').value=value('profile-name',activeResource().name);}
   if(state.module==='generation'&&activeResource())q('.ss-page-head small').textContent=activeResource().name+' · Chat Completion';
   syncSelection();syncEditing();
  }
  q('.ss-header-status').textContent=state.dirty?'未保存':'已保存';icons();
  if(renderedModule!==null)motion(q('.ss-resource-editor')||q('.ss-world-grid>section:nth-child(3)')||q('.ss-content'),[{opacity:.65,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}]);
  renderedModule=state.module;
 }
 function close(refocus=false){if(openAnchor){openAnchor.setAttribute('aria-expanded','false');if(refocus)openAnchor.focus();}q('.ss-overlay').hidden=true;openKey=null;}
 function dropdown(id,button){close();openKey=id;openAnchor=button;button.setAttribute('aria-expanded','true');q('.ss-overlay').hidden=false;const f=fields.get(id),selected=button.textContent.trim(),menu=q('.ss-dropdown');menu.setAttribute('aria-label',f.label);menu.innerHTML=f.options.map(v=>`<button role="option" aria-selected="${v===selected}" data-option="${esc(v)}"><span class="ss-choice-dot"></span><span>${esc(v)}</span></button>`).join('');icons();position();menu.querySelector('[aria-selected=true]')?.focus();}
 function position(){if(!openKey)return;const r=root.getBoundingClientRect(),a=openAnchor.getBoundingClientRect(),d=q('.ss-dropdown');d.style.width=Math.min(Math.max(a.width,200),r.width-20)+'px';const h=d.getBoundingClientRect().height;d.style.left=Math.max(9,Math.min(a.left-r.left,r.width-d.offsetWidth-10))+'px';d.style.top=Math.max(9,Math.min(a.bottom-r.top+6,r.height-h-10))+'px';}
 function addResource(){let id;do{id=state.module+'-new-'+(++copySerial);}while(catalog().some(r=>r.id===id));catalog().push({id,name:'新'+resourceLabel(),note:'未命名'});state.resource=catalog().length-1;render();changed();status('已新建'+resourceLabel()+' · 预览');}
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.hasAttribute('data-batch-cancel'))return confirmClose();
  if(b.hasAttribute('data-batch-confirm')){
   const ids=selected(),currentId=activeResource()?.id,n=ids.length;
   state.catalogs[state.module]=catalog().filter(r=>!ids.includes(r.id));
   for(const k of Object.keys(state.values))if(ids.some(id=>k.startsWith(state.module+':'+id+':')))delete state.values[k];
   state.selectedResources[state.module]=[];state.resource=Math.max(0,catalog().findIndex(r=>r.id===currentId));
   confirmClose();render();changed();status(`已删除 ${n} 个${resourceLabel()} · 仅操作预览数据`);q('[data-resource-all]')?.focus();return;
  }
  if(b.hasAttribute('data-new-resource'))return addResource();
  if(b.dataset.batch)return batch(b.dataset.batch);
  if(b.dataset.module){state.module=b.dataset.module;state.resource=0;state.prompt=0;state.sub=modules.find(m=>m[0]===state.module)[3][0];render();remember();return;}
  if(b.dataset.sub){state.sub=b.dataset.sub;render();remember();return;}
  if(b.dataset.select){if(openKey===b.dataset.select)close(true);else dropdown(b.dataset.select,b);return;}
  if(b.dataset.option!==undefined){
   const id=openKey;state.values[key(id)]=b.dataset.option;const anchor=openAnchor;close();const label=anchor.querySelector('span');label.textContent=b.dataset.option;
   motion(label,[{opacity:.3,transform:'translateY(2px)'},{opacity:1,transform:'translateY(0)'}]);anchor.focus();
   if(id==='extension-select'){state.extension=b.dataset.option;render();}changed();return;
  }
  if(b.dataset.resource!==undefined){state.resource=Number(b.dataset.resource);render();remember();return;}
  if(b.dataset.prompt!==undefined){state.prompt=Number(b.dataset.prompt);render();remember();return;}
  if(b.dataset.bg){state.bg=b.dataset.bg;render();changed();return;}
  if(b.dataset.extension){state.extension=b.dataset.extension;state.sub=b.dataset.extension==='快捷回复'?'快捷回复':b.dataset.extension==='正则'?'正则':'扩展设置';render();remember();return;}
  if(b.hasAttribute('data-save')){state.dirty=false;q('.ss-header-status').textContent='已保存';motion(q('.ss-header-status'),[{opacity:.4},{opacity:1}]);status('已保存 · 预览，未修改酒馆设置');remember();return;}
  if(b.dataset.action){const a=b.dataset.action;
   if(manager()&&['connection-new','world-new','template-new'].includes(a))return addResource();
   if(manager()&&['connection-delete','template-delete'].includes(a)&&activeResource()){state.selectedResources[state.module]=[activeResource().id];syncSelection();remember();return confirmDelete();}
   if(['tts','stt','audio'].includes(a)){state.module='extensions';state.sub='扩展设置';state.extension=a==='tts'?'TTS':a==='stt'?'语音输入':'背景音频';render();remember();}
   status('预览 · '+(b.textContent.trim()||b.getAttribute('aria-label'))+(a==='test'||a==='connect'?'，未发送请求':''));
  }
 });
 root.addEventListener('input',e=>{const x=e.target;if(x.dataset.field){state.values[key(x.dataset.field)]=x.type==='checkbox'?x.checked:x.value;if(x.type==='range')q(`[data-range-output="${x.dataset.field}"]`).textContent=x.value+(x.dataset.unit||'');if(x.type==='color')q(`[data-color-output="${x.dataset.field}"]`).textContent=x.value;changed();}if(x.hasAttribute('data-ext-search'))qa('[data-extension-name]').forEach(el=>el.hidden=!el.dataset.extensionName.toLowerCase().includes(x.value.toLowerCase()));if(x.hasAttribute('data-role-search'))qa('[data-role-name]').forEach(el=>el.hidden=!el.textContent.includes(x.value));if(x.hasAttribute('data-bg-search'))qa('[data-bg]').forEach(el=>el.hidden=!el.dataset.bg.includes(x.value));});
 root.addEventListener('change',e=>{
  const x=e.target;if(x.type==='checkbox')checkMotion(x);
  if(x.hasAttribute('data-resource-all')){state.selectedResources[state.module]=x.checked?catalog().map(r=>r.id):[];syncSelection();qa('[data-resource-select]').forEach(checkMotion);remember();return;}
  if(x.dataset.resourceSelect){const id=x.dataset.resourceSelect;state.selectedResources[state.module]=x.checked?[...new Set([...selected(),id])]:selected().filter(n=>n!==id);syncSelection();remember();return;}
  if(x.dataset.roleSelect!==undefined){const i=Number(x.dataset.roleSelect);state.selectedRoles=x.checked?[...new Set([...state.selectedRoles,i])]:state.selectedRoles.filter(n=>n!==i);x.closest('.ss-role').classList.toggle('is-selected',x.checked);q('[data-selection-count]').textContent=state.selectedRoles.length+' 已选';remember();}
 });
 document.addEventListener('pointerdown',e=>{if(openKey&&!q('.ss-dropdown').contains(e.target)&&!openAnchor.contains(e.target))close();});
 document.addEventListener('keydown',e=>{
  if(confirming){if(e.key==='Escape'){e.preventDefault();confirmClose();}if(e.key==='Tab'){const opts=qa('.ss-confirm-dialog button'),index=opts.indexOf(document.activeElement);opts[(index+(e.shiftKey?opts.length-1:1)+opts.length)%opts.length].focus();e.preventDefault();}return;}
  if(e.key==='Escape'&&openKey){e.preventDefault();close(true);}
  if(openKey&&['ArrowDown','ArrowUp'].includes(e.key)){const opts=qa('.ss-dropdown [role=option]'),index=opts.indexOf(document.activeElement);opts[(index+(e.key==='ArrowDown'?1:opts.length-1)+opts.length)%opts.length]?.focus();e.preventDefault();}
 });
 window.addEventListener('resize',position);window.addEventListener('openai:set_globals',e=>{const next=e.detail?.globals?.widgetState?.privateContent;if(next&&modules.some(m=>m[0]===next.module)){if(next===state||JSON.stringify(next)===JSON.stringify(state))return;if(confirming)confirmClose();state={...state,...next};render();}});render();
})();
