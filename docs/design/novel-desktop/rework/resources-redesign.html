&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;noval-resource-redesign&#x27;), page=root.querySelector(&#x27;.nr-page&#x27;), layer=root.querySelector(&#x27;.nr-layer&#x27;);
  const saved=window.openai?.widgetState?.privateContent || {};
  const state={ panel:[&#x27;connection&#x27;,&#x27;preset&#x27;,&#x27;persona&#x27;].includes(saved.panel)?saved.panel:&#x27;connection&#x27;, connection:saved.connection||&#x27;Claude · 日常&#x27;, preset:saved.preset||&#x27;长篇 · 细腻 v3&#x27;, persona:saved.persona||&#x27;沈砚&#x27;, entry:Number.isInteger(saved.entry)?saved.entry:0, provider:saved.provider||&#x27;OpenRouter&#x27;, dirty:false };
  let dirty=false, opener=null;
  const originalPrompts=[
    {name:&#x27;Main Prompt&#x27;,role:&#x27;system&#x27;,enabled:true,content:&#x27;你是一位擅长细腻叙事的小说作者。\n\n以人物的行动、对白和感官细节推动故事，保持叙述视角一致。\n&lt;story&gt;\n{{char}} 与 {{user}} 的故事仍在继续。\n&lt;/story&gt;&#x27;},
    {name:&#x27;World Info (before)&#x27;,role:&#x27;动态内容&#x27;,enabled:true,content:&#x27;&#x27;},
    {name:&#x27;Char Description&#x27;,role:&#x27;动态内容&#x27;,enabled:true,content:&#x27;&#x27;},
    {name:&#x27;Char Personality&#x27;,role:&#x27;动态内容&#x27;,enabled:true,content:&#x27;&#x27;},
    {name:&#x27;Scenario&#x27;,role:&#x27;动态内容&#x27;,enabled:true,content:&#x27;&#x27;},
    {name:&#x27;Chat History&#x27;,role:&#x27;动态内容&#x27;,enabled:true,content:&#x27;&#x27;},
    {name:&#x27;World Info (after)&#x27;,role:&#x27;动态内容&#x27;,enabled:true,content:&#x27;&#x27;},
    {name:&#x27;Post-History Instructions&#x27;,role:&#x27;system&#x27;,enabled:false,content:&#x27;保持对白自然，避免替用户作决定。&#x27;}
  ];
  let prompts=structuredClone(originalPrompts);
  let pins=[&quot;温度&quot;,&quot;回复上限&quot;];
  const parameters={&quot;温度&quot;:&quot;0.85&quot;,&quot;回复上限&quot;:&quot;2048&quot;,&quot;Top P&quot;:&quot;1&quot;,&quot;上下文上限&quot;:&quot;200000&quot;,&quot;重复惩罚&quot;:&quot;1&quot;,&quot;思考强度&quot;:&quot;medium&quot;};
  const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const icon=name=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  const pick=(label,key,value)=&gt;`&lt;button type=&quot;button&quot; class=&quot;nr-picker cursor-interaction&quot; data-picker=&quot;${key}&quot; role=&quot;combobox&quot; aria-label=&quot;${label}&quot; aria-expanded=&quot;false&quot;&gt;&lt;span&gt;${esc(value)}&lt;/span&gt;${icon(&#x27;chevron-down&#x27;)}&lt;/button&gt;`;
  const field=(label,content)=&gt;`&lt;label class=&quot;nr-field&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;${content}&lt;/label&gt;`;
  const input=(label,value,extra=&#x27;&#x27;)=&gt;`&lt;input aria-label=&quot;${label}&quot; value=&quot;${esc(value)}&quot; ${extra}&gt;`;
  const check=(label,on=true)=&gt;`&lt;label class=&quot;nr-check cursor-interaction&quot;&gt;&lt;input type=&quot;checkbox&quot; ${on?&#x27;checked&#x27;:&#x27;&#x27;}&gt;${label}&lt;/label&gt;`;
  const fold=(title,content)=&gt;`&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;${title}${icon(&#x27;chevron-down&#x27;)}&lt;/summary&gt;${content}&lt;/details&gt;`;
  const deeper=`&lt;button class=&quot;nr-icon cursor-interaction&quot; aria-label=&quot;独立管理&quot; data-notice=&quot;独立管理布局沿用已确认方案&quot;&gt;${icon(&#x27;maximize-2&#x27;)}&lt;/button&gt;`;
  function heading(kind,name,actions=&#x27;&#x27;) {
    return `&lt;header class=&quot;nr-heading&quot;&gt;&lt;span class=&quot;nr-eyebrow&quot;&gt;${kind}&lt;/span&gt;&lt;div class=&quot;nr-title-row&quot;&gt;&lt;button class=&quot;nr-title cursor-interaction&quot; data-picker=&quot;${state.panel}&quot; role=&quot;combobox&quot; aria-label=&quot;选择${kind}&quot; aria-expanded=&quot;false&quot;&gt;&lt;span&gt;${esc(name)}&lt;/span&gt;${icon(&#x27;chevron-down&#x27;)}&lt;/button&gt;&lt;span class=&quot;nr-spacer&quot;&gt;&lt;/span&gt;${deeper}&lt;/div&gt;${actions}&lt;/header&gt;`;
  }
  function connection() {
    const actions=`&lt;div class=&quot;nr-header-actions&quot;&gt;&lt;button class=&quot;nr-button cursor-interaction&quot; data-new&gt;${icon(&#x27;plus&#x27;)}新建&lt;/button&gt;&lt;button class=&quot;nr-button cursor-interaction&quot; data-record&gt;${icon(&#x27;bookmark-plus&#x27;)}记录&lt;/button&gt;&lt;button class=&quot;nr-button nr-danger cursor-interaction&quot; data-delete&gt;${icon(&#x27;trash-2&#x27;)}删除&lt;/button&gt;&lt;/div&gt;`;
    return heading(&#x27;连接&#x27;,state.connection,actions)+`&lt;div class=&quot;nr-content&quot;&gt;
      &lt;div class=&quot;nr-section-title&quot;&gt;API 连接配置&lt;span class=&quot;nr-spacer&quot;&gt;&lt;/span&gt;&lt;span class=&quot;nr-dot&quot;&gt;&lt;/span&gt;&lt;span&gt;当前连接&lt;/span&gt;&lt;/div&gt;
      ${field(&#x27;模型&#x27;,`&lt;div class=&quot;nr-title-row&quot;&gt;${pick(&#x27;模型&#x27;,&#x27;model&#x27;,&#x27;anthropic/claude-opus-4.1&#x27;)}&lt;button class=&quot;nr-icon cursor-interaction&quot; aria-label=&quot;刷新模型&quot; data-notice=&quot;模型列表已刷新 · 预览&quot;&gt;${icon(&#x27;refresh-cw&#x27;)}&lt;/button&gt;&lt;/div&gt;`)}
      &lt;div class=&quot;nr-connect-actions&quot;&gt;&lt;button class=&quot;nr-button nr-primary cursor-interaction&quot; data-connect&gt;${icon(&#x27;plug-zap&#x27;)}连接&lt;/button&gt;&lt;button class=&quot;nr-button cursor-interaction&quot; data-test&gt;${icon(&#x27;flask-conical&#x27;)}测试&lt;/button&gt;&lt;span class=&quot;nr-spacer&quot;&gt;&lt;/span&gt;&lt;span class=&quot;nr-note nr-connect-status&quot;&gt;未发送请求&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;nr-pair&quot;&gt;${field(&#x27;接口类型&#x27;,pick(&#x27;接口类型&#x27;,&#x27;apiType&#x27;,&#x27;Chat Completion&#x27;))}${field(&#x27;服务商&#x27;,pick(&#x27;服务商&#x27;,&#x27;provider&#x27;,state.provider))}&lt;/div&gt;
      ${field(&#x27;服务地址&#x27;,input(&#x27;服务地址&#x27;,state.provider===&#x27;OpenRouter&#x27;?&#x27;https://openrouter.ai/api/v1&#x27;:state.provider===&#x27;Anthropic&#x27;?&#x27;https://api.anthropic.com&#x27;:&#x27;https://api.openai.com/v1&#x27;))}
      ${field(&#x27;API 密钥&#x27;,`&lt;div class=&quot;nr-input-action&quot;&gt;&lt;input type=&quot;password&quot; autocomplete=&quot;off&quot; aria-label=&quot;API 密钥&quot; placeholder=&quot;输入密钥或选择已保存的账号&quot;&gt;&lt;button class=&quot;nr-icon cursor-interaction&quot; data-picker=&quot;credential&quot; role=&quot;combobox&quot; aria-expanded=&quot;false&quot; aria-label=&quot;选择已保存密钥&quot;&gt;${icon(&#x27;key-round&#x27;)}&lt;/button&gt;&lt;/div&gt;`)}
      &lt;div class=&quot;nr-note&quot;&gt;${icon(&#x27;shield-check&#x27;)}已保存账号 · 创作常用&lt;/div&gt;
      &lt;hr class=&quot;nr-divider&quot;&gt;
      &lt;div class=&quot;nr-pair&quot;&gt;${field(&#x27;绑定预设&#x27;,pick(&#x27;绑定预设&#x27;,&#x27;binding&#x27;,&#x27;长篇 · 细腻 v3&#x27;))}${field(&#x27;模型分组&#x27;,input(&#x27;模型分组&#x27;,&#x27;Claude&#x27;))}&lt;/div&gt;
      ${fold(&#x27;服务商选项&#x27;,check(&#x27;允许模型回退&#x27;,false)+check(&#x27;显示模型详细信息&#x27;,true)+field(&#x27;模型排序&#x27;,pick(&#x27;模型排序&#x27;,&#x27;modelSort&#x27;,&#x27;默认顺序&#x27;)))}
      ${fold(&#x27;代理与请求&#x27;,field(&#x27;反向代理地址&#x27;,input(&#x27;反向代理地址&#x27;,&#x27;&#x27;,&#x27;placeholder=&quot;可选&quot;&#x27;))+field(&#x27;自定义请求头&#x27;,&#x27;&lt;textarea aria-label=&quot;自定义请求头&quot; rows=&quot;3&quot; placeholder=&quot;JSON 格式&quot;&gt;&lt;/textarea&gt;&#x27;)+field(&#x27;自定义请求体&#x27;,&#x27;&lt;textarea aria-label=&quot;自定义请求体&quot; rows=&quot;3&quot; placeholder=&quot;JSON 格式&quot;&gt;&lt;/textarea&gt;&#x27;))}
      ${fold(&#x27;配置应用范围&#x27;,check(&#x27;记录模型&#x27;,true)+check(&#x27;记录预设&#x27;,true)+check(&#x27;记录正则配置&#x27;,false)+field(&#x27;跳过字段&#x27;,&#x27;&lt;textarea aria-label=&quot;跳过字段&quot; rows=&quot;3&quot; placeholder=&quot;每行一个字段名&quot;&gt;&lt;/textarea&gt;&#x27;))}
    &lt;/div&gt;`;
  }
  function preset() {
    return heading(&#x27;预设&#x27;,state.preset)+`&lt;section class=&quot;nr-common&quot;&gt;&lt;div class=&quot;nr-common-checks&quot;&gt;${check(&#x27;流式传输&#x27;)}${check(&#x27;请求思维链&#x27;,false)}&lt;/div&gt;
      &lt;div class=&quot;nr-parameter-strip&quot;&gt;${pins.map(label=&gt;`&lt;label class=&quot;nr-mini-field&quot;&gt;${label}${input(label,parameters[label],`data-parameter=&quot;${label}&quot; class=&quot;${label.includes(&quot;上限&quot;)?&quot;wide&quot;:&quot;&quot;}&quot; ${label===&quot;思考强度&quot;?&quot;&quot;:&#x27;type=&quot;number&quot; step=&quot;any&quot;&#x27;}`)}&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;span class=&quot;nr-spacer&quot;&gt;&lt;/span&gt;&lt;button class=&quot;nr-icon cursor-interaction&quot; aria-label=&quot;配置常用项&quot; aria-expanded=&quot;false&quot; data-pins&gt;${icon(&#x27;sliders-horizontal&#x27;)}&lt;/button&gt;&lt;/div&gt;
      &lt;details class=&quot;nr-pin-details&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;常用项${icon(&#x27;chevron-down&#x27;)}&lt;/summary&gt;&lt;div class=&quot;nr-pins&quot;&gt;${Object.keys(parameters).map(label=&gt;`&lt;label class=&quot;nr-check cursor-interaction&quot;&gt;&lt;input type=&quot;checkbox&quot; data-pin=&quot;${label}&quot; ${pins.includes(label)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;${label}&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;
      &lt;section class=&quot;nr-prompts&quot;&gt;&lt;div class=&quot;nr-list-head&quot;&gt;&lt;strong&gt;提示词&lt;/strong&gt;&lt;small&gt;· ${prompts.length}&lt;/small&gt;&lt;span class=&quot;nr-spacer&quot;&gt;&lt;/span&gt;${pick(&#x27;提示词作用范围&#x27;,&#x27;scope&#x27;,&#x27;全局&#x27;)}&lt;button class=&quot;nr-icon cursor-interaction&quot; aria-label=&quot;新增提示词&quot; data-add&gt;${icon(&#x27;plus&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;nr-prompt-rows&quot;&gt;${prompts.map((p,i)=&gt;`&lt;div class=&quot;nr-prompt-row ${state.entry===i?&#x27;is-selected&#x27;:&#x27;&#x27;} ${p.enabled?&#x27;&#x27;:&#x27;is-off&#x27;}&quot;&gt;&lt;input type=&quot;checkbox&quot; aria-label=&quot;启用 ${esc(p.name)}&quot; data-enabled=&quot;${i}&quot; ${p.enabled?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;button class=&quot;nr-prompt-name cursor-interaction&quot; data-entry=&quot;${i}&quot;&gt;&lt;span&gt;${esc(p.name)}&lt;/span&gt;&lt;small&gt;${p.role}&lt;/small&gt;&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;
      &lt;section class=&quot;nr-prompt-editor&quot;&gt;${promptEditor()}&lt;/section&gt;
      &lt;div class=&quot;nr-preset-more&quot;&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;更多预设设置${icon(&#x27;chevron-down&#x27;)}&lt;/summary&gt;${fold(&#x27;其他生成参数&#x27;,`&lt;div class=&quot;nr-pair&quot;&gt;${field(&#x27;Top P&#x27;,input(&#x27;Top P&#x27;,&#x27;1&#x27;,&#x27;type=&quot;number&quot; step=&quot;0.1&quot;&#x27;))}${field(&#x27;频率惩罚&#x27;,input(&#x27;频率惩罚&#x27;,&#x27;0&#x27;,&#x27;type=&quot;number&quot; step=&quot;0.1&quot;&#x27;))}&lt;/div&gt;`)}${fold(&#x27;提示格式与绑定&#x27;,field(&#x27;世界书格式&#x27;,&#x27;&lt;textarea aria-label=&quot;世界书格式&quot; rows=&quot;3&quot;&gt;{{worldInfo}}&lt;/textarea&gt;&#x27;)+check(&#x27;绑定当前连接&#x27;,false)+check(&#x27;绑定当前模型&#x27;,false))}${fold(&#x27;文件与管理&#x27;,`&lt;div class=&quot;nr-persona-tools&quot;&gt;${[&#x27;新建&#x27;,&#x27;另存为&#x27;,&#x27;导入&#x27;,&#x27;导出&#x27;,&#x27;删除&#x27;].map(t=&gt;`&lt;button class=&quot;nr-button cursor-interaction&quot; data-notice=&quot;${t} · 布局预览&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`)}&lt;/details&gt;&lt;/div&gt;`;
  }
