<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>大纲与生图 · 工作台交互预览</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="preview.css">
  <script src="preview.js" defer></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-tree" viewBox="0 0 24 24"><path d="M6 3v12a3 3 0 0 0 3 3h3M6 9h6"/><rect x="3" y="2" width="6" height="4" rx="1"/><rect x="12" y="7" width="8" height="4" rx="1"/><rect x="12" y="16" width="8" height="4" rx="1"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-8 8M10 21H3v-7M3 21l8-8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-3-3-7-3-10-2v16c4-1 7-1 10 2 3-3 6-3 10-2V3c-3-1-7-1-10 2Zm0 0v16"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M3 6h5m4 0h9M3 12h11m4 0h3M3 18h3m4 0h11M8 3v6m6 0v6M6 15v6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M8 2v6m8-6v6M6 8h12v5a6 6 0 0 1-12 0Zm6 11v3"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11a8 8 0 0 1-8 8H5l-3 3V5a3 3 0 0 1 3-3h8a8 8 0 0 1 8 9Z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V4h6l3 3h9v13H3Z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m16 3 5 5L8 21H3v-5ZM14 5l5 5M14 21h7"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9L2 9Zm0 0L11 13"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 14 8-14 8Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M20 12H4m7-7-7 7 7 7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 2v13m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 4V3H3v13h1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-magic" viewBox="0 0 24 24"><path d="m3 21 13-13 4 4L7 25ZM12 3v3M3 12h3M19 2v3M20 20h3M2 3l3 3"/></symbol>

    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/></symbol>

    <symbol id="i-indent" viewBox="0 0 24 24"><path d="M11 4h10M11 9h10M11 15h10M11 20h10M3 8l4 4-4 4"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6V3h16v3M12 3v18M8 21h8"/></symbol>
  </defs></svg>
  <header class="topbar">
    <div class="identity"><img src="../rp-desktop/assets/r-character.webp" alt=""><div><strong>Seraphina</strong><small>附加功能 · 设计预览</small></div></div>
    <nav class="resource-bar" aria-label="既有资源入口示意"><span><i data-icon="plug"></i>创作连接</span><span><i data-icon="sliders"></i>叙事预设</span><span><i data-icon="book"></i>Eldoria</span><span><i data-icon="user"></i>yuwk</span></nav>
    <div class="top-actions"><button class="icon-button" data-action="settings" title="附加功能设置" aria-label="附加功能设置"><i data-icon="settings"></i></button><div class="mode-control"><button class="icon-button" data-action="mode-step" aria-label="切换显示模式"><i data-icon="chevron" class="reverse"></i></button><button class="icon-button" id="mode-button" data-action="mode-menu" aria-label="工作台模式菜单" aria-expanded="false"><i data-icon="book"></i></button><button class="icon-button" data-action="mode-step" aria-label="切换下一个显示模式"><i data-icon="chevron"></i></button></div></div>
  </header>
  <div class="shell" id="shell">
    <aside class="navigation" aria-label="创作导航">
      <div class="nav-heading"><i data-icon="chat"></i>聊天管理<span class="grow"></span><small>当前聊天</small></div>
      <div class="chat-card"><small><span class="status-dot online"></span>正在进行</small><strong>林间的约定</strong><span>Seraphina · <b id="message-count">3</b> 层</span></div>
      <div class="outline-heading" id="outline-entry"><button class="fold-toggle" data-action="fold-tree" aria-expanded="true"><i data-icon="tree"></i>大纲 <small id="outline-count"></small><span class="grow"></span><i data-icon="chevron" class="down"></i></button><button class="icon-button" data-action="deep-outline" aria-label="完整大纲编辑" title="完整编辑"><i data-icon="expand"></i></button></div>
      <div class="fold-body is-open" id="nav-outline"><div><label class="search"><i data-icon="search"></i><input type="search" data-field="tree-search" placeholder="搜索大纲" aria-label="搜索左侧大纲"></label><div class="tree" id="nav-tree" role="tree" aria-label="当前聊天大纲"></div><button class="text-button nav-add" data-action="add-node"><i data-icon="plus"></i>添加节点</button></div></div>
      <div class="nav-bottom"><span class="caption">工作台设置 · 沿用当前组件</span><div class="settings-grid" aria-label="既有设置入口示意"><span><i data-icon="sliders"></i>生成配置</span><span><i data-icon="plug"></i>连接</span><span><i data-icon="text"></i>回复格式</span><span><i data-icon="book"></i>世界书</span><span><i data-icon="settings"></i>用户设置</span><span><i data-icon="image"></i>背景</span><button data-action="settings"><i data-icon="plus"></i>扩展</button><span><i data-icon="user"></i>用户设定</span><span><i data-icon="user"></i>角色管理</span></div><div class="nav-foot"><button data-action="shortcuts"><i data-icon="keyboard"></i>快捷键</button><button data-action="guide"><i data-icon="eye"></i>预览说明</button></div></div>
    </aside>
    <main class="story" id="story">
      <div class="reading-heading"><i data-icon="book"></i><span>林间的约定</span><span class="grow"></span><small>Noval</small></div>
      <div class="rp-sprites" aria-hidden="true"><img src="../rp-desktop/assets/r-user-character.webp" alt=""><img src="../rp-desktop/assets/r-character.webp" alt=""></div>
      <div class="messages" id="messages" aria-label="示例聊天楼层"></div>
      <div class="manual-image-note" id="manual-image-note" hidden>手动生图 · 原草稿已暂存<button data-action="cancel-manual-image">取消</button></div><div class="composer-wrap"><div class="composer"><span class="grip"></span><textarea id="draft" aria-label="示例输入框" placeholder="写下你的回应…"></textarea><div class="composer-toolbar"><button class="icon-button" data-action="guide" aria-label="工具说明"><i data-icon="more"></i></button><span class="grow"></span><div id="task-badges" aria-live="polite"></div><button class="send-button" data-action="send-demo" aria-label="发送示例回应"><i data-icon="send"></i></button></div></div></div>
    </main>
    <aside class="workarea" id="workarea" aria-label="右侧临时工作区"><div class="panel-selector"><button data-action="panel-outline" id="outline-tab"><i data-icon="tree"></i>大纲</button><button data-action="panel-image" id="image-tab"><i data-icon="image"></i>生图</button><span class="grow"></span><button class="icon-button" data-action="close-right" aria-label="收起工作区"><i data-icon="chevron"></i></button></div><div id="panel-content"></div></aside>
    <button class="edge edge-left" data-action="toggle-left" aria-label="收起左侧导航" aria-expanded="true"><i data-icon="chevron" class="reverse"></i></button><button class="edge edge-right" data-action="toggle-right" aria-label="收起右侧工作区" aria-expanded="true"><i data-icon="chevron"></i></button>
  </div>
  <section class="deep-page" id="deep-page" aria-label="完整编辑页" hidden></section>
  <div class="popover" id="mode-menu" hidden><button data-action="mode-novel"><i data-icon="book"></i>Noval · 阅读</button><button data-action="mode-rp"><i data-icon="theater"></i>RP · 舞台</button></div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
