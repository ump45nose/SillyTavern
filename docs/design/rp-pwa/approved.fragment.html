#rp-pwa textarea{display:block;flex:1;min-width:0;width:auto;height:44px;max-height:132px;padding:10px 16px;border:1px solid #e7e2d9;border-radius:23px;background:var(--np-surface);font:16px/22px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;resize:none;overflow-y:auto}
#rp-pwa .np-send{background:var(--np-accent);color:#fffdf8}
#rp-pwa .np-send:disabled{opacity:.45}
#rp-pwa .np-file-label{padding:8px 8px 0}
#rp-pwa .np-toast{bottom:88px}
#rp-pwa .rp-tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 6px;padding:0 0 17px;border-bottom:1px solid var(--np-line)}
#rp-pwa .rp-tool-grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:72px;border-radius:15px;font-size:12px;background:var(--np-soft)}
#rp-pwa .rp-tool-grid svg{width:22px;height:22px;color:#80705e}
#rp-pwa .rp-config-row{display:flex;align-items:center;gap:8px;min-height:48px;width:100%;text-align:left;font-size:12px;border-bottom:1px solid var(--np-line);padding:0 4px}
#rp-pwa .rp-config-row>span:first-of-type{color:var(--np-muted);width:58px}
#rp-pwa .rp-config-row>span:nth-of-type(2){flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rp-pwa .rp-config-row svg{width:15px;height:15px}
#rp-pwa .rp-message-menu-note{font-size:11px;color:var(--np-muted);margin-bottom:8px}
#rp-pwa .rp-candidate-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;border-bottom:1px solid var(--np-line);padding:0 8px 8px}
#rp-pwa .rp-candidate-row>div{display:flex;align-items:center;gap:8px}
#rp-pwa.np-editing .np-header,#rp-pwa.np-editing .rp-portrait-stage{display:none}
#rp-pwa.np-editing .np-bottom{border:0;padding:0;flex:1;min-height:0}
#rp-pwa.np-editing .np-compose{padding:0 15px 10px;display:flex;flex-direction:column;flex:1;min-height:0}
#rp-pwa.np-editing .rp-compose-row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;grid-template-rows:minmax(0,1fr) 44px;gap:12px 8px;flex:1;min-height:0;padding-top:12px}
#rp-pwa.np-editing textarea{grid-area:1/1/2/4;width:100%;height:100%!important;max-height:none;padding:8px 5px;border:0;border-radius:0;background:none;line-height:1.9}
#rp-pwa.np-editing .rp-plus{grid-area:2/1}
#rp-pwa.np-editing .np-send{grid-area:2/3}
#rp-pwa .np-app{position:absolute;z-index:2;top:35px;right:0;bottom:19px;left:0;background:var(--np-paper);overflow:hidden;border-radius:0}
#rp-pwa .rp-portrait-stage{position:absolute;z-index:0;inset:35px 0 19px;height:auto;overflow:hidden;touch-action:none}
#rp-pwa [data-standee]{height:535px;top:12px;left:50%;transform:translateX(-50%)}
#rp-pwa .rp-stage-caption,#rp-pwa .rp-stage-close{display:none}
#rp-pwa .np-home{position:absolute;z-index:3;bottom:0;left:0;right:0;background:var(--np-paper)}
#rp-pwa .np-status{z-index:3;position:relative;background:var(--np-paper)}
#rp-pwa.rp-sheet-lowered .np-app{border-radius:25px 25px 0 0;box-shadow:0 -8px 28px #46382a12}
#rp-pwa.rp-sheet-lowered .np-header{height:74px;padding-top:19px;position:relative;border-bottom:0}
#rp-pwa.rp-sheet-lowered .np-header:before{content:"";position:absolute;top:9px;left:calc(50% - 18px);width:36px;height:4px;background:#cbc4b9;border-radius:4px;pointer-events:none}
#rp-pwa .np-header{touch-action:none;user-select:none}
#rp-pwa.rp-sheet-lowered .np-reader{padding-top:6px}
#rp-pwa.np-editing .np-app{top:35px!important;border-radius:0;box-shadow:none}
#rp-pwa.np-editing .rp-portrait-stage{display:none}
#rp-pwa .rp-portrait-stage{inset:0;height:100%;width:100%}
#rp-pwa [data-standee]{inset:0;transform:none;height:100%;width:100%;object-fit:contain;object-position:50% 28px}
#rp-pwa.rp-stage-open .np-status,#rp-pwa.rp-sheet-lowered .np-status{background:transparent}
#rp-pwa.np-editing .np-status{background:var(--np-paper)}

function menu(title,items){show('sheet',title,items.map(([t,a])=>row(t,'',a)).join(''))}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.config){config(b.dataset.config);return}if(b.dataset.next){const k=b.dataset.next;state[k]=(state[k]+1)%3;apply();save();config(k);return}if(b.dataset.select){const[k,i]=b.dataset.select.split(':');state[k]=+i;apply();save();close();return}if(b.dataset.detail){const[k,i]=b.dataset.detail.split(':');detail(k,+i);return}if(b.dataset.tab){roles(b.dataset.tab);return}if(b.dataset.demo){toast(b.dataset.demo);return}if(b.dataset.jump){if(b.dataset.jump==='2'){close();q('.np-reader').scrollTop=q('.np-reader').scrollHeight}else toast('本版展示「雨停之前」；大纲位置已保留');return}if(b.dataset.quick){close();draft.value=b.dataset.quick;updateDraft();draft.focus();return}const a=b.dataset.action;
if(a==='close')close();else if(a==='outline')outline();else if(a==='roles')roles();else if(a==='expand'){close();edit(true)}else if(a==='collapse')edit(false);else if(a==='latest'){close();q('.np-reader').scrollTop=q('.np-reader').scrollHeight}else if(a==='continue')toast('续写入口预览 · 未调用模型');else if(a==='regenerate')toast('重生成入口预览 · 未调用模型');else if(a==='chat-menu')menu('聊天菜单',[['跳到最新回复','data-action="latest"'],['聊天记录','data-action="outline"'],['导出记录','data-demo="记录导出页后续设计"']]);else if(a==='extensions')menu('扩展工具',[['生图','data-demo="生图入口预览"'],['扩展设置','data-action="settings"']]);else if(a==='quick')menu('快速回复',[['我想等你一起','data-quick="“我还没拆，想等你一起。”"'],['把信递给她','data-quick="*把信递给她，轻轻点头。*"'],['问起那艘船','data-quick="“那艘船……和你有关，对吗？”"']]);else if(a==='attach')q('[data-file]').click();else if(a==='appearance'){show('sheet','消息样式',`<div class="np-panel-head"><span>消息字号 · ${state.font}px</span><button class="np-next cursor-interaction" data-action="font">切换字号 ${icon('type')}</button></div>`)}else if(a==='font'){state.font=state.font>=19?14:state.font+1;apply();save();b.previousElementSibling.textContent='消息字号 · '+state.font+'px'}else if(a==='settings')menu('设置',[['消息样式','data-action="appearance"'],['连接','data-config="connection"'],['预设','data-config="preset"'],['世界书','data-config="world"'],['用户设定','data-config="persona"']]);else if(a==='edit-message'){if(!panel.hidden)close();draft.value=Array.from(q('.np-prose').querySelectorAll('p')).map(p=>p.textContent).join('\n\n');edit(true);editingMessage=true;updateDraft()}else if(a==='copy'){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(q('.np-prose').innerText).then(()=>toast('已复制正文')).catch(()=>toast('浏览器未授权复制，请长按选择正文'));else toast('请长按选择正文进行复制')}else if(a==='send'){if(editingMessage){const article=q('.np-prose');article.replaceChildren(...draft.value.split(/\n\s*\n/).map(t=>{const p=document.createElement('p');p.textContent=t;return p}));toast('已保存到预览')}else{appendUserMessage();toast('已添加到预览，未调用模型')}draft.value='';q('[data-file]').value='';q('[data-file-label]').hidden=true;edit(false);q('.np-reader').scrollTop=q('.np-reader').scrollHeight;updateDraft()}});
q('[data-shade]').addEventListener('click',close);draft.addEventListener('input',updateDraft);q('[data-file]').addEventListener('change',()=>{const f=q('[data-file]').files[0];q('[data-file-label]').hidden=!f;q('[data-file-label]').textContent=f?'附件 · '+f.name:'';updateDraft()});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!panel.hidden)close();else if(root.classList.contains('np-editing'))edit(false)}if(e.key==='Tab'&&!panel.hidden){const els=[...panel.querySelectorAll('button,summary,input,textarea')].filter(x=>x.getClientRects().length),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let swipe=null;
root.addEventListener('touchstart',e=>{
 if(e.touches.length!==1||root.classList.contains('np-editing')){swipe=null;return}
 const target=e.target,zone=target.closest('.np-reader,.np-panel-left,.np-panel-right');
 if(!zone||target.closest('input,textarea')||(zone.matches('.np-reader')&&target.closest('button'))){swipe=null;return}
 const t=e.touches[0];swipe={x:t.clientX,y:t.clientY,time:performance.now(),zone};
},{passive:true});
root.addEventListener('touchend',e=>{
 if(!swipe)return;
 const start=swipe;swipe=null;
 const t=e.changedTouches[0],dx=t.clientX-start.x,dy=t.clientY-start.y;
 if(performance.now()-start.time>850||Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.5)return;
 if(e.cancelable)e.preventDefault();
 if(panel.hidden&&start.zone.matches('.np-reader')){if(dx>0)outline();else roles()}
 else if(!panel.hidden&&((start.zone.matches('.np-panel-left')&&dx<0)||(start.zone.matches('.np-panel-right')&&dx>0)))close();
},{passive:false});
root.addEventListener('touchcancel',()=>{swipe=null},{passive:true});
requestAnimationFrame(()=>{q('.np-reader').scrollTop=q('.np-reader').scrollHeight});
let replyIndex=0;
const replyVariants=[
 [{text:'她的目光在信封上停了片刻，又看向你。',action:true},{text:'“信你看过了？”'},{text:'“……还是说，你不敢看。”'}],
 [{text:'她没有碰那封信，只把柜台上的灯往你这边推了推。',action:true},{text:'“要不要在这里拆开？”'},{text:'“这次，我陪你看。”'}]
];
function renderReply(){const prose=q('.np-prose');prose.replaceChildren(...replyVariants[replyIndex].map(item=>{const p=document.createElement('p');p.textContent=item.text;if(item.action)p.className='rp-action';return p}));}
function appendUserMessage(){
 const message=document.createElement('article');message.className='rp-message rp-self';
 const face=document.createElement('div');face.className='rp-face';const img=document.createElement('img');img.src=userAvatar;img.alt=configs.persona.items[state.persona];face.append(img);
 const body=document.createElement('div');body.className='rp-message-body';const author=document.createElement('span');author.className='rp-author';author.textContent=configs.persona.items[state.persona];
 const bubble=document.createElement('div');bubble.className='rp-bubble';
 for(const text of draft.value.split(/\n\s*\n/)){if(!text.trim())continue;const p=document.createElement('p');p.textContent=text;if(text.startsWith('*')&&text.endsWith('*')){p.className='rp-action';p.textContent=text.slice(1,-1)}bubble.append(p)}
 const file=q('[data-file]').files[0];if(file){const p=document.createElement('p');p.textContent='附件 · '+file.name;p.className='rp-action';bubble.append(p)}
 body.append(author,bubble);message.append(face,body);q('.rp-timeline').append(message);
}
root.addEventListener('click',e=>{const a=e.target.closest('button')?.dataset.action;
 if(a==='reply-prev'||a==='reply-next'){replyIndex=a==='reply-prev'?0:1;renderReply();messageOptions()}
 if(a==='message-options')messageOptions();
 if(a==='message-trace')roles('trace');
});

function allTools(){show('sheet','聊天工具',`<div class="rp-tool-grid">${[['paperclip','附件','attach'],['fast-forward','续写','continue'],['rotate-ccw','重生成','regenerate'],['zap','快速回复','quick'],['image','生图与扩展','extensions'],['maximize-2','全屏输入','expand']].map(([ico,t,a])=>`<button class="cursor-interaction" data-action="${a}">${icon(ico)}<span>${t}</span></button>`).join('')}</div>`+Object.keys(configs).map(k=>`<button class="rp-config-row cursor-interaction" data-config="${k}"><span>${configs[k].title}</span><span>${configs[k].items[state[k]]}</span>${icon('chevron-right')}</button>`).join('')+row('当前回复操作','编辑 · 复制 · 候选回复 · Trace','data-action="message-options"','message-square'))}
function messageOptions(){show('sheet','这条回复',`<div class="rp-candidate-row"><span>候选回复</span><div><button class="np-icon cursor-interaction" data-action="reply-prev" aria-label="上一条候选回复" ${replyIndex===0?'disabled':''}>${icon('chevron-left')}</button><span>${replyIndex+1} / 2</span><button class="np-icon cursor-interaction" data-action="reply-next" aria-label="下一条候选回复" ${replyIndex===1?'disabled':''}>${icon('chevron-right')}</button></div></div>`+[['编辑回复','edit-message'],['复制回复','copy'],['重新生成','regenerate'],['查看 Trace','message-trace']].map(([t,a])=>row(t,'',`data-action="${a}"`)).join(''))}
function sheetPosition(top,distance){
 app.style.top=top+'px';root.classList.toggle('rp-sheet-lowered',top>55);
 const reader=q('.np-reader');reader.scrollTop=reader.scrollHeight-reader.clientHeight-distance;
}
function setStage(on){
 if(root.sheetAnimation)cancelAnimationFrame(root.sheetAnimation);
 const reader=q('.np-reader'),distance=Math.max(0,reader.scrollHeight-reader.scrollTop-reader.clientHeight);
 state.stageOpen=on;root.classList.toggle('rp-stage-open',on);
 q('[data-stage-toggle]').setAttribute('aria-expanded',String(on));
 q('[data-stage-toggle]').setAttribute('aria-label',on?'林间，上滑聊天面板回到完整聊天页':'林间，下拉聊天页面展示立绘');
 const target=on?360:35,start=parseFloat(app.style.top)||35,portrait=q('.rp-portrait-stage');
 portrait.hidden=false;
 const finish=()=>{sheetPosition(target,distance);portrait.hidden=!on;root.sheetAnimation=null};
 if(Math.abs(target-start)<1||matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return}
 const began=performance.now();
 function frame(now){const t=Math.min(1,(now-began)/230),ease=1-Math.pow(1-t,3);sheetPosition(start+(target-start)*ease,distance);if(t<1)root.sheetAnimation=requestAnimationFrame(frame);else finish()}
 root.sheetAnimation=requestAnimationFrame(frame);
}
const stageToggle=q('[data-stage-toggle]'),stage=q('.rp-portrait-stage'),sheetHeader=q('.np-header');
let gesture=null,suppressStageClick=false;
for(const el of [sheetHeader,stage]){
 el.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  if(root.sheetAnimation)cancelAnimationFrame(root.sheetAnimation);
  const reader=q('.np-reader');
  gesture={id:e.pointerId,x:e.clientX,y:e.clientY,top:parseFloat(app.style.top)||35,distance:Math.max(0,reader.scrollHeight-reader.scrollTop-reader.clientHeight),moved:false};
  suppressStageClick=false;
 });
 el.addEventListener('pointermove',e=>{
  if(!gesture||gesture.id!==e.pointerId)return;
  const dy=e.clientY-gesture.y,dx=e.clientX-gesture.x;
  if(!gesture.moved&&Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){gesture.moved=true;el.setPointerCapture(e.pointerId);stage.hidden=false}
  if(gesture.moved){sheetPosition(Math.max(35,Math.min(360,gesture.top+dy)),gesture.distance);e.preventDefault()}
 });
 el.addEventListener('pointerup',e=>{
  if(!gesture||gesture.id!==e.pointerId)return;
  const dy=e.clientY-gesture.y,wasMoved=gesture.moved;gesture=null;suppressStageClick=wasMoved;
  if(wasMoved){const top=parseFloat(app.style.top)||35;setStage(Math.abs(dy)>48?dy>0:top>197);save()}
 });
 el.addEventListener('pointercancel',()=>{gesture=null;suppressStageClick=true;setStage(state.stageOpen)});
 el.addEventListener('click',e=>{if(suppressStageClick){e.preventDefault();e.stopImmediatePropagation();suppressStageClick=false}},true);
}
stageToggle.addEventListener('click',()=>{setStage(!state.stageOpen);save()});
q('[data-stage-close]').addEventListener('click',()=>{setStage(false);save()});
const bubble=q('.np-prose');let press=null,pressStart=null;
bubble.addEventListener('pointerdown',e=>{if(e.button!==0)return;pressStart={x:e.clientX,y:e.clientY};press=setTimeout(()=>{press=null;messageOptions()},550)});
bubble.addEventListener('pointermove',e=>{if(pressStart&&Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>9){clearTimeout(press);press=null}});
for(const type of ['pointerup','pointercancel','pointerleave'])bubble.addEventListener(type,()=>{clearTimeout(press);press=null});
bubble.addEventListener('contextmenu',e=>{e.preventDefault();clearTimeout(press);messageOptions()});
root.addEventListener('click',e=>{if(e.target.closest('button')?.dataset.action==='all-tools')allTools()});

if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{apply();save()}});tweak.addSlider(state,'font',{label:'消息字号',min:14,max:19,step:1,unit:'px'});tweak.addSlider(state,'leading',{label:'消息行距',min:1.6,max:2.2,step:.05});tweak.addToggle(state,'stageOpen',{label:'展开立绘'});}
})();
</script>
